<!doctype html>
<html lang="en" data-band="clean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagida — site report</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="report.css">
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="face" id="iris"></div>
    <div class="lead">
      <p class="label">Site report</p>
      <h1 id="domain">…</h1>
      <p class="verdict" id="verdict">Gathering everything I can find.</p>
      <p class="full mono" id="full-url"></p>
    </div>
    <div class="score-ring" id="score-ring" hidden>
      <span class="n" id="score">–</span>
      <span class="label" id="band-name"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="risk" aria-selected="true">Risk</button>
    <button role="tab" data-tab="site" aria-selected="false">The site</button>
    <button role="tab" data-tab="host" aria-selected="false">Where it lives</button>
    <button role="tab" data-tab="mail" aria-selected="false">Email &amp; trust</button>
  </nav>

  <main>
    <section class="panel" data-panel="risk"></section>
    <section class="panel" data-panel="site" hidden></section>
    <section class="panel" data-panel="host" hidden></section>
    <section class="panel" data-panel="mail" hidden></section>
  </main>

  <footer>
    <div class="acts">
      <button id="report-site" class="solid">Report this as a scam</button>
      <button id="trust-site">Mark as safe</button>
      <button id="recheck">Check again</button>
    </div>
    <p class="sources dim" id="sources"></p>
  </footer>
</div>
<script src="report.js"></script>
</body>
</html>
