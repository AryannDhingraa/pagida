<!doctype html>
<html lang="en" data-band="clean">
<head>
  <meta charset="utf-8">
  <title>Pagida</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app">
    <section class="top">
      <div class="face" id="iris"></div>
      <div class="say">
        <h1 id="headline">Checking this page…</h1>
        <p class="host mono" id="host"></p>
      </div>
    </section>

    <p class="advice" id="advice">One moment.</p>

    <section class="score" id="score-block" hidden>
      <div class="meter"><i id="meter"></i></div>
      <div class="scale">
        <span class="label" id="band-name">Nothing found</span>
        <span class="num" id="score">0</span>
      </div>
    </section>

    <section class="found" id="found" hidden>
      <h2 class="label" id="found-count">What I found</h2>
      <ul id="signals"></ul>
    </section>

    <section class="empty" id="empty" hidden>
      <p id="empty-text"></p>
    </section>
  </main>

  <footer>
    <div class="acts" id="acts" hidden>
      <button id="primary" class="solid">Looks fine</button>
      <button id="secondary">Report this site</button>
      <button id="undo" hidden>Undo my choice</button>
    </div>
    <div class="links">
      <button class="linkish" id="report-link">
        Full site report
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="linkish quiet" id="options-link">Settings</button>
    </div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
